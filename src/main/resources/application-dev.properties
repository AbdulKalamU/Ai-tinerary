# Development Profile (H2 In-Memory Database)

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:file:./data/aitinerarydb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS vector AS VARCHAR;
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for local dev (rely on Hibernate ddl-auto)
spring.flyway.enabled=false
