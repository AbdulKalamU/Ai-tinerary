# Application Name
spring.application.name=ai-tinerary

# Server Configuration
server.port=8080

# AI Provider Configuration
ai.provider=${AI_PROVIDER:groq}

# Groq AI API Configuration
groq.api.key=${GROQ_API_KEY:not_configured}
groq.api.model=${GROQ_MODEL:llama-3.1-8b-instant}
groq.api.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.api.max-retries=${GROQ_MAX_RETRIES:3}
groq.api.timeout-seconds=${GROQ_TIMEOUT_SECONDS:30}

# Gemini AI API Configuration (fallback provider)
gemini.api.key=${GEMINI_API_KEY:not_configured}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-flash-latest}
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.api.version=${GEMINI_API_VERSION:v1beta}
gemini.api.max-retries=${GEMINI_MAX_RETRIES:3}
gemini.api.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY:not_configured}
openai.api.model=${OPENAI_MODEL:gpt-4o-mini}
openai.api.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.api.max-retries=${OPENAI_MAX_RETRIES:3}
openai.api.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}
# JWT Configuration
jwt.secret=${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVKd3RTZWNyZXRLZXlGb3JEZXZPbmx5Q2hhbmdlSW5Qcm9k}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Spring Profile Configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA/Hibernate Base Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.aitinerary=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
